    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Favor Gift</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>

   <ul>
     <li><a href="index.html">Laman Utama</a></li>
    <li><a href="products.html">Produk</a></li>
    <li><a href="about.html">Tentang Kami</a></li>
    <li><a href="contact.html">Hubungi Kami</a></li>
     
    <li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>
</ul>
</nav>

<section class="checkout-page">

<div class="checkout-container">

<h1>Buat Tempahan</h1>

<p class="checkout-subtitle">
Sila lengkapkan maklumat tempahan anda.
</p>

<form id="orderForm" class="checkout-form">

        <label>Nama Penuh</label>
        <input type="text" id="nama" required>

        <label>No Telefon</label>
        <input type="tel" id="telefon" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Tarikh Majlis</label>
        <input type="date" id="tarikh" required>

        <label>Jenis Majlis</label>
        <select id="majlis">
            <option>Perkahwinan</option>
            <option>Hari Jadi</option>
            <option>Korporat</option>
        </select>

   <label>No. Rujukan Pembayaran</label>

<input
    type="text"
    id="paymentRef"
    placeholder="Contoh: DN123456789"
    required>

<small>
Masukkan nombor rujukan pembayaran DuitNow / Online Banking.
</small>
        <label>Catatan Tambahan</label>
        <textarea id="catatan" rows="4"></textarea>

        <button type="submit" class="submit-btn">
            Hantar Tempahan
        </button>

    </form>
</div>
</section>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){

    e.preventDefault();

    let btn = document.querySelector(".submit-btn");

    btn.disabled = true;
    btn.innerHTML = "Menghantar Tempahan...";

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

    

if(!receipt){

    alert("Sila muat naik bukti pembayaran.");

    btn.disabled = false;
    btn.innerHTML = "Hantar Tempahan";

    return;
}

let file = document.getElementById("receipt").files[0];

let reader = new FileReader();

reader.onload = function() {

let data = {
    nama: document.getElementById("nama").value,
    telefon: document.getElementById("telefon").value,
    email: document.getElementById("email").value,

    produk: cart.map(item => item.name).join(", "),
    kuantiti: "'" + cart.map(item => item.quantity).join(", "),
    pilihan: cart.map(item => item.pilihan).join(", "),

    tarikhMajlis: document.getElementById("tarikh").value,

    receipt: reader.result
};

  fetch("https://script.google.com/macros/s/AKfycbxj2pAUWqCE3w8eoDafr4muSPurUsiKzFAnVewUfqzmxUKCw9gkL-zaGIp2JoZh8ESmBg/exec", {
    method: "POST",
    mode: "no-cors",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
})
.then(() => {

    alert("Tempahan berjaya dihantar!");

    localStorage.removeItem("cart");

    window.location.href = "index.html";

})
.catch(error => {

    btn.disabled = false;
    btn.innerHTML = "Hantar Tempahan";

    alert("Ralat menghantar tempahan");
    console.log(error);

});

};

reader.readAsDataURL(file);

});
</script>
</body>
</html>
