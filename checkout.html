<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Favor Gift</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">🛒</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<section class="checkout-page">

    <h1>Checkout</h1>
    <p>Sila lengkapkan maklumat tempahan anda.</p>

    <form id="orderForm">

        <label>Nama Penuh</label>
        <input type="text" id="nama" required>

        <label>No Telefon</label>
        <input type="tel" id="telefon" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Tarikh Majlis</label>
        <input type="date" id="tarikh" required>

        <label>Jenis Majlis</label>
        <select id="majlis">
            <option>Perkahwinan</option>
            <option>Hari Jadi</option>
            <option>Korporat</option>
        </select>

         <label>Tarikh Tempahan</label>
        <input type="date" id="bookingDate" required>

        <label>Masa Tempahan</label>
        <input type="time" id="bookingTime" required>


        <label>Catatan Tambahan</label>
        <textarea id="catatan" rows="4"></textarea>

        <button type="submit" class="submit-btn">
            Hantar Tempahan
        </button>

    </form>

</section>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){

    e.preventDefault();

    let btn = document.querySelector(".submit-btn");

    btn.disabled = true;
    btn.innerHTML = "Menghantar Tempahan...";

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

let refNumber = localStorage.getItem("duitnowRef") || "";

let data = {
    nama: document.getElementById("nama").value,
    telefon: document.getElementById("telefon").value,
    email: document.getElementById("email").value,

    produk: cart.map(item => item.name).join(", "),
    kuantiti: cart.map(item => item.quantity).join(", "),

    pilihan: cart.map(item => item.pilihan).join(", "),

    tarikhTempahan: document.getElementById("bookingDate").value,
    tarikhMajlis: document.getElementById("tarikh").value,

    refnumber: refNumber
};

   fetch("https://script.google.com/macros/s/AKfycby0E7MqPgwm2PlhGbOaUudV7YjMNH0Ruh0zgGU8vO2n_OzbPYpcvVng-_BM04A-s40xlQ/exec", {
    method: "POST",
    mode: "no-cors",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
})
.then(() => {

    alert("Tempahan berjaya dihantar!");

    localStorage.removeItem("cart");

    window.location.href = "index.html";

})
.catch(error => {

    btn.disabled = false;
    btn.innerHTML = "Hantar Tempahan";

    alert("Ralat menghantar tempahan");
    console.log(error);

});
});
</script>
</body>
</html>
