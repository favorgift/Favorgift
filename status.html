<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semak Status Tempahan</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>

    <ul>
        <li><a href="index.html">Laman Utama</a></li>
        <li><a href="products.html">Produk</a></li>
        <li><a href="status.html">Status</a></li>
        <li><a href="about.html">Tentang Kami</a></li>
        <li><a href="contact.html">Hubungi Kami</a></li>
        <li>
            <a href="cart.html">
                🛒 <span id="cart-count">0</span>
            </a>
        </li>
    </ul>
</nav>

<section class="status-page">

<div class="status-container">

<h1>Semak Status Tempahan</h1>

<p>
Masukkan nombor telefon yang digunakan semasa membuat tempahan.
</p>

<input
type="text"
id="phone"
placeholder="Contoh: 123456789">

<button id="semakBtn" onclick="semakStatus()">
Semak Status
</button>

<div id="result"></div>

<button
class="back-btn"
onclick="window.location.href='products.html'">
← Kembali ke Produk
</button>

</div>

</section>

<script src="script.js"></script>

<script>

function semakStatus(){

    let btn = document.getElementById("semakBtn");

    btn.disabled = true;
    btn.innerHTML = "Sedang Menyemak...";

    let phone = document.getElementById("phone").value.trim();

    if(phone === ""){

        alert("Sila masukkan nombor telefon.");

        btn.disabled = false;
        btn.innerHTML = "Semak Status";

        return;
    }

    fetch("https://script.google.com/macros/s/AKfycbxj2pAUWqCE3w8eoDafr4muSPurUsiKzFAnVewUfqzmxUKCw9gkL-zaGIp2JoZh8ESmBg/exec?phone=" + phone)

    .then(response => response.json())

    .then(data => {

        btn.disabled = false;
        btn.innerHTML = "Semak Status";

        if(data.status === "Tiada Tempahan Dijumpai"){

            document.getElementById("result").innerHTML =
            "<p>❌ Tiada Tempahan Dijumpai</p>";

            return;
        }

        let html = "";

        data.forEach((item,index)=>{

            html += `
            <div class="status-card">

            <h3>Tempahan ${index + 1}</h3>

            <p><b>Nama:</b> ${item.nama}</p>

            <p><b>Produk:</b> ${item.produk}</p>

            <p><b>Kuantiti:</b> ${item.kuantiti}</p>

            <p><b>Tarikh Tempahan:</b> ${item.tarikh}</p>

            <p><b>Status Tempahan:</b> ${item.status}</p>

            <p><b>Status Pembayaran:</b> ${item.pembayaran}</p>

            </div>
            `;
        });

        document.getElementById("result").innerHTML = html;

    })

    .catch(error => {

        console.log(error);

        btn.disabled = false;
        btn.innerHTML = "Semak Status";

        document.getElementById("result").innerHTML =
        "<p>❌ Ralat mendapatkan data</p>";
    });

}

</script>

</body>
</html>
