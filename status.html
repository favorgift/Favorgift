<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Semak Status Tempahan</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f8f5f1;
    text-align:center;
    padding:40px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#8b5e3c;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    margin-top:20px;
    text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h2>Semak Status Tempahan</h2>

<input
type="text"
id="phone"
placeholder="Masukkan No Telefon(Cth:1234567890)">

<br>

<button id="semakBtn" onclick="semakStatus()">
Semak Status
</button>

<div id="result"></div>

<button
onclick="window.location.href='products.html'"
class="back-btn">
← Kembali ke Produk
</button>
    
</div>

<script>

function semakStatus(){

    let btn = document.getElementById("semakBtn");
    btn.disabled = true;
    btn.innerHTML = "Sedang Menyemak...";

    let phone = document.getElementById("phone").value;

    fetch("https://script.google.com/macros/s/AKfycbxj2pAUWqCE3w8eoDafr4muSPurUsiKzFAnVewUfqzmxUKCw9gkL-zaGIp2JoZh8ESmBg/exec?phone=" + phone)
    .then(response => response.json())
    .then(data => {

        btn.disabled = false;
        btn.innerHTML = "Semak Status";

        if(data.status == "Tiada Tempahan Dijumpai"){
            document.getElementById("result").innerHTML = "<p>❌ Tiada Tempahan Dijumpai</p>";
            return;
        }

        document.getElementById("result").innerHTML = `
            <p><b>Nama:</b> ${data.nama}</p>
            <p><b>Produk:</b> ${data.produk}</p>
            <p><b>Kuantiti:</b> ${data.kuantiti}</p>
            <p><b>Tarikh Tempahan:</b> ${data.tarikh}</p>
            <p><b>Status Tempahan:</b> ${data.status}</p>
            <p><b>Status Pembayaran:</b> ${data.pembayaran}</p>
        `;
    })
    .catch(error => {
        console.log(error);
        btn.disabled = false;
        btn.innerHTML = "Semak Status";
        document.getElementById("result").innerHTML = "<p>❌ Ralat mendapatkan data</p>";
    });
}

</script>

</body>
</html>
