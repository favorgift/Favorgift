<div class="container">

<h2>Semak Status Tempahan</h2>

<input
type="text"
id="phone"
placeholder="Masukkan No Telefon(Cth:1234567890)">

<br>

<button id="semakBtn" onclick="semakStatus()">
Semak Status
</button>

<div id="result"></div>

<button
onclick="window.location.href='products.html'"
class="back-btn">
← Kembali ke Produk
</button>
    
</div>

<script>

function semakStatus(){

    let btn = document.getElementById("semakBtn");
    btn.disabled = true;
    btn.innerHTML = "Sedang Menyemak...";

    let phone = document.getElementById("phone").value;

    fetch("https://script.google.com/macros/s/AKfycbxj2pAUWqCE3w8eoDafr4muSPurUsiKzFAnVewUfqzmxUKCw9gkL-zaGIp2JoZh8ESmBg/exec?phone=" + phone)
    .then(response => response.json())
    .then(data => {

        btn.disabled = false;
        btn.innerHTML = "Semak Status";

        if(data.status == "Tiada Tempahan Dijumpai"){
    document.getElementById("result").innerHTML =
    "<p>❌ Tiada Tempahan Dijumpai</p>";
    return;
}

let html = "";

data.forEach((item,index)=>{

html += `
<hr>

<h3>Tempahan ${index + 1}</h3>

<p><b>Nama:</b> ${item.nama}</p>
<p><b>Produk:</b> ${item.produk}</p>
<p><b>Kuantiti:</b> ${item.kuantiti}</p>
<p><b>Tarikh Tempahan:</b> ${item.tarikh}</p>
<p><b>Status Tempahan:</b> ${item.status}</p>
<p><b>Status Pembayaran:</b> ${item.pembayaran}</p>
`;

});

document.getElementById("result").innerHTML = html;
    })
    .catch(error => {
        console.log(error);
        btn.disabled = false;
        btn.innerHTML = "Semak Status";
        document.getElementById("result").innerHTML = "<p>❌ Ralat mendapatkan data</p>";
    });
}

</script>
