<div class="admin-container">

    <h1>Admin Stock Management</h1>

    <!-- Wedding -->
    <div class="stock-group">
        <h2>💍 Wedding Collection</h2>

        <div class="stock-item"><label>Sabun Tangan</label><input type="number" id="sabun" value="20"></div>
        <div class="stock-item"><label>Madu</label><input type="number" id="madu" value="20"></div>
        <div class="stock-item"><label>Lilin</label><input type="number" id="lilin" value="20"></div>
        <div class="stock-item"><label>Tuala Kecil</label><input type="number" id="tuala" value="20"></div>
        <div class="stock-item"><label>Set Cawan</label><input type="number" id="setcawan" value="20"></div>
        <div class="stock-item"><label>Kipas Mini</label><input type="number" id="kipas" value="20"></div>
        <div class="stock-item"><label>Set Sudu & Garfu</label><input type="number" id="sudu" value="20"></div>
        <div class="stock-item"><label>Tisu</label><input type="number" id="tisu" value="20"></div>
        <div class="stock-item"><label>Sejadah Mini</label><input type="number" id="sejadah" value="20"></div>
        <div class="stock-item"><label>Coklat Strawberi</label><input type="number" id="coklat" value="20"></div>
    </div>

    <!-- Birthday -->
    <div class="stock-group">
        <h2>🎂 Birthday Collection</h2>

        <div class="stock-item"><label>Gula-Gula</label><input type="number" id="gula" value="20"></div>
        <div class="stock-item"><label>Popcorn</label><input type="number" id="popcorn" value="20"></div>
        <div class="stock-item"><label>Biskut Coklat Cip</label><input type="number" id="biskut" value="20"></div>
        <div class="stock-item"><label>Mini Makaron</label><input type="number" id="makaron" value="20"></div>
        <div class="stock-item"><label>Gula Kapas</label><input type="number" id="kapas" value="20"></div>
        <div class="stock-item"><label>Kek Cawan</label><input type="number" id="kek" value="20"></div>
        <div class="stock-item"><label>Minyak Wangi Kereta</label><input type="number" id="minyak" value="20"></div>
        <div class="stock-item"><label>Hand Sanitizer</label><input type="number" id="sanitizer" value="20"></div>
        <div class="stock-item"><label>Bubble Wand</label><input type="number" id="bubble" value="20"></div>
        <div class="stock-item"><label>Penyepit Kuku</label><input type="number" id="kuku" value="20"></div>
    </div>

    <!-- Corporate -->
    <div class="stock-group">
        <h2>🏢 Corporate Collection</h2>

        <div class="stock-item"><label>Pen</label><input type="number" id="pen" value="20"></div>
        <div class="stock-item"><label>Cawan</label><input type="number" id="cawan" value="20"></div>
        <div class="stock-item"><label>Buku Nota</label><input type="number" id="nota" value="20"></div>
        <div class="stock-item"><label>Termos</label><input type="number" id="termos" value="20"></div>
        <div class="stock-item"><label>Kalender</label><input type="number" id="kalender" value="20"></div>
        <div class="stock-item"><label>Fail</label><input type="number" id="fail" value="20"></div>
        <div class="stock-item"><label>Bekas Pensil</label><input type="number" id="pensil" value="20"></div>
        <div class="stock-item"><label>Nota Pelekat Buku</label><input type="number" id="pelekat" value="20"></div>
        <div class="stock-item"><label>Lanyard</label><input type="number" id="lanyard" value="20"></div>
        <div class="stock-item"><label>Kotak Bekal</label><input type="number" id="bekal" value="20"></div>
    </div>


</div>
    
    <button class="save-btn" onclick="saveStock()">
    Simpan Stok
</button>
    
<script src="script.js"></script>
