<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Favor Gift</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">🛒</a></li>
    </ul>
</nav>

<section class="cart-page">

<div class="cart-layout">

    <div class="cart-left">

        <h1 class="cart-title">MY CART</h1>

        <div id="cart-items"></div>

    </div>

    <div class="cart-right">

        <h3>Ringkasan Tempahan</h3>

        <p>Jumlah Item: <span id="jumlah-item">0</span></p>

        <p>Subtotal: <span id="subtotal">RM0.00</span></p>

        <p>Penghantaran: RM5.00</p>

        <hr>

        <h3>Jumlah: <span id="jumlah-bayar">RM0.00</span></h3>

        <hr>

        <h4>Kaedah Pembayaran</h4>

        <label>
            <input type="radio" name="payment">
            Online Banking
        </label><br>

        <label>
            <input type="radio" name="payment">
            DuitNow QR
        </label><br>

        <label>
            <input type="radio" name="payment">
            Bayar Semasa Ambil
        </label>

        <br><br>

        <button class="checkout-btn"
        onclick="window.location.href='checkout.html'">
            Teruskan Tempahan
        </button>

    </div>

</div>

</section>

<script src="script.js"></script>

<script>
displayCart();
</script>

</body>
</html>
